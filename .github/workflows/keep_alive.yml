name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (15-min idle timeout)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          TARGET_URL="${BACKEND_URL:-https://producttruth-api.onrender.com}/health"
          echo "Pinging $TARGET_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Warning: Backend returned status $HTTP_STATUS"
            exit 1
          fi
          echo "Backend is live and healthy!"
