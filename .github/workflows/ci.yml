name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Backend: lint + type-check + test + eval ─────────────────────────────
  backend:
    name: "Backend (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: producttruth_test
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: api/requirements*.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check api/ scripts/

      - name: Format check (black)
        run: black --check api/ scripts/

      - name: Run full test suite with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/producttruth_test
          GROQ_API_KEY: "gsk_test_key_not_real"
          CONFIDENCE_THRESHOLD: "0.7"
        run: |
          pytest api/tests/ \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run eval (no DB or API key needed)
        run: python scripts/eval.py

      - name: Build Docker image
        if: matrix.python-version == '3.11'
        run: docker build -t producttruth-api:ci -f Dockerfile .

  # ─── Frontend: lint + type-check + build ──────────────────────────────────
  frontend:
    name: "Frontend (Node 20)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type check (tsc)
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint (eslint)
        run: npm run lint
        working-directory: web

      - name: Build (Next.js)
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ─── Deployment: Cloud Deploy Stage (Render / Vercel Webhook) ───────────────
  deploy:
    name: "Deploy to Production Cloud"
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Deployment Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "Production deployment webhook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK secret not set. Skipping production webhook."
          fi
