[project]
name = "producttruth"
version = "0.1.0"
description = "Product Truth API & Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.2.5",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.1",
    "openai>=1.35.0",
    "pymupdf==1.24.5",
    "pillow==10.3.0",
    "httpx==0.27.0",
    "sse-starlette==2.1.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "tenacity==8.3.0",
    "structlog==24.2.0",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

